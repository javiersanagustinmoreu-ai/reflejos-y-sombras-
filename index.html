<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflejos y sombras — Javier Sanagustín Moreu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE3;
    --bg-raised: #FBF8F2;
    --fg: #1C1C1A;
    --fg-soft: #6B665C;
    --fg-faint: #A39D8F;
    --accent: #1E2A5E;
    --line: #D9D2C3;
  }
  [data-theme="dark"] {
    --bg: #14141a;
    --bg-raised: #1b1b22;
    --fg: #E8E4D8;
    --fg-soft: #948F82;
    --fg-faint: #56534a;
    --accent: #7C8CE0;
    --line: #2c2c34;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }

  /* layout */
  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { display: flex; justify-content: space-between; align-items: flex-start; padding: 28px 24px 18px; }
  .brand { font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg); line-height: 1.6; cursor: pointer; }
  .brand span { display:block }
  main { flex:1; padding: 6px 24px 60px; }
  footer.bottom { padding: 20px 24px 36px; display:flex; justify-content:space-between; border-top:1px solid var(--line); margin-top:40px }

  /* home portada */
  .home-portada {
    display:block;
    max-width: 100%;
    width: auto;
    max-height: 62vh;
    height: auto;
    padding: 18px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    margin: 8px auto 40px;
    box-sizing: border-box;
    object-fit: contain;
  }
  @media (min-width: 640px) { .home-portada { padding: 28px; } }
  .home-portada.small { max-height: 220px; margin: 0 auto 18px; padding: 12px; }

  /* obra image and placeholders */
  .obra-image { width:100%; aspect-ratio:4/3; background:var(--bg-raised); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; margin-bottom:34px }
  .obra-image .placeholder { font-family:'DM Sans',sans-serif; font-size:10.5px; color:var(--fg-faint); text-transform:uppercase; display:flex; align-items:center; justify-content:center; padding:6px; }
  .obra-frame { display:block; width:100%; height:auto; padding:18px; background:var(--bg-raised); border:1px solid var(--line); margin-bottom:34px }

  /* bio image small variant */
  .bio-image { width:150px; max-width:45%; aspect-ratio:3/4; margin:22px 0 26px; }
  .back-link { display:inline-block; margin-top:20px; font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-soft); border-bottom:1px solid var(--line); }

  .hidden { display:none !important; }
  .hires-link.hidden { display:none !important; }

  .label { font-family: 'DM Sans', sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-faint); }
  .artist-sig { font-style: italic; font-size: 15px; color: var(--fg-faint); }
  .expo-dates { font-family:'DM Sans',sans-serif; font-size:10px; color:var(--fg-faint) }

  h1.titulo { font-size:44px; margin-bottom:30px }
  h2.titulo { font-size:34px; margin-bottom:18px }
  .cuerpo p { font-size:19px; line-height:1.65; margin-bottom:18px }

  .dot { width:9px; height:9px; border-radius:50% }
  .dot.reflejo { background: var(--bg-raised); border: 1.3px solid var(--fg); }
  .dot.sombra { background: var(--fg); border: 1.3px solid var(--fg); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* Data (simplified) */
const ORDEN = [
  "antes-de-encontrar","luz-retenida","hacia-arriba","cerro-encendido",
  "entre-fragmentos","llanura-interior","antes-de-ver","en-el-umbral",
  "mirada-encarnada","ardiente-calma","sin-distancia","pupila-azul",
  "no-caigas","antes-de-reconocer"
];

const OBRAS = {
  "antes-de-encontrar": { bloque: "Apertura", titulo: "Antes de <em>encontrar</em>", clase: "sombra", tecnica: "Técnica mixta sobre lienzo", dimensiones: "160 × 60 cm", ano: "2021", obra: ["Texto descriptivo de la obra (resumido)."], referencia_link: null },
  "luz-retenida": { bloque: "Bloque paisaje", titulo: "Luz <em>retenida</em>", clase: "sombra", tecnica: "Óleo sobre lienzo", dimensiones: "120 × 110 cm", ano: "2025", obra: ["Texto descriptivo de la obra."], referencia_link: { autor: "Claude Monet — Agapanthus", url: "https://www.moma.org/" } },
  "antes-de-reconocer": { bloque: "Cierre", titulo: "Antes de <em>reconocer</em>", clase: "sombra", tecnica: "Óleo sobre lienzo", dimensiones: "97 × 162 cm", ano: "2026", obra: ["Descripción."], referencia_link: null }
};

const VINILOS = { "texto-artista-tabique": { label: "Texto de artista", texto: ["Texto del artista."] }, "vinilo-paisaje": { label: "Antes del bloque paisaje", texto: ["Texto del vinilo de paisaje."] } };
const SEQUENCE = [ { type: "vinilo", id: "texto-artista-tabique" }, { type: "obra", id: "antes-de-encontrar" }, { type: "obra", id: "luz-retenida" }, { type: "obra", id: "antes-de-reconocer" } ];

const IMG_EXTS = ['jpg','JPG','jpeg','JPEG','png','PNG'];
function imgSrcAt(id,i){ return `img/${id}.${IMG_EXTS[i]}` }
function imgPath(id){ return imgSrcAt(id,0) }
const PORTADA_IMG = imgSrcAt('portada',0);

function handleImgError(img, phId){
  const i = (parseInt(img.dataset.extIdx || '0',10)) + 1;
  if (i < IMG_EXTS.length){ img.dataset.extIdx = String(i); img.src = imgSrcAt(img.dataset.imgid || 'portada', i); }
  else if (phId){ img.classList.add('hidden'); const ph = document.getElementById(phId); if(ph) ph.classList.remove('hidden'); }
}

function handleObraImgLoad(img,id){
  // show image, hide placeholder and reveal hires link if present
  img.classList.remove('hidden');
  const ph = img.nextElementSibling;
  if(ph && ph.classList) ph.classList.add('hidden');
  const hires = document.getElementById('hires-'+id);
  if(hires) hires.classList.remove('hidden');
}

function getRoute(){
  const hash = location.hash.replace('#','');
  if(!hash||hash==='/') return {type:'home'};
  if(OBRAS[hash]) return {type:'obra', id:hash};
  if(VINILOS[hash]) return {type:'vinilo', id:hash};
  if(hash==='biografia') return {type:'biografia'};
  if(hash==='epilogo') return {type:'epilogo'};
  return {type:'home'};
}
function seqNeighbors(id){ const idx = SEQUENCE.findIndex(item => item.id===id); if(idx===-1) return {prev:null,next:null}; return { prev: idx>0 ? SEQUENCE[idx-1] : null, next: idx < SEQUENCE.length-1 ? SEQUENCE[idx+1] : null } }

function setTheme(t){ document.documentElement.setAttribute('data-theme', t); localStorage.setItem('rys-theme', t) }
function initTheme(){ const saved = localStorage.getItem('rys-theme'); if(saved){ setTheme(saved); return } const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; setTheme(prefersDark ? 'dark' : 'light') }
function toggleTheme(){ const cur = document.documentElement.getAttribute('data-theme'); setTheme(cur==='dark' ? 'light' : 'dark') }

function header(){ return `\n  <header class="top">\n    <div>\n      <div class="brand" onclick="location.hash=''">\n        <span>Reflejos y</span><span>sombras</span>\n      </div>\n    </div>\n    <div>\n      <button class="theme-toggle" onclick="toggleTheme()">Tema</button>\n    </div>\n  </header>` }
function footer(){ return `\n  <footer class="bottom">\n    <span class="artist-sig">Javier Sanagustín Moreu</span>\n    <span class="expo-dates">Huesca · 8 oct – 11 nov 2026</span>\n  </footer>` }

function renderHome(){
  const worklistHtml = ORDEN.filter(id => OBRAS[id]).map((id,i)=>{ const o = OBRAS[id]; const dotHtml = o.clase ? `<span class="dot ${o.clase}"></span>` : ''; return `<li><a href="#${id}"><span class="num">${String(i+1).padStart(2,'0')}</span> ${dotHtml} ${o.titulo}</a></li>` }).join('');
  return `\n  ${header()}\n  <main>\n    <img class="home-portada" src="${PORTADA_IMG}" data-imgid="portada" data-ext-idx="0" alt="Portada" onerror="handleImgError(this, 'portada-ph')" loading="eager">\n    <div id="portada-ph" class="obra-image hidden"><span class="placeholder">img/portada.[jpg|png]</span></div>\n    <section>\n      <h1 class="titulo">Reflejos y sombras</h1>\n      <ul>${worklistHtml}</ul>\n    </section>\n  </main>\n  ${footer()}`;
}

function adquirirObraAcc(id){ const bodyHtml = `<p style="color:var(--fg-faint); font-style:italic;">Información de venta no disponible.</p>`; return `\n  <div class="acc-item" data-acc="adquirir-${id}">\n    <button class="acc-head" onclick="toggleAcc(this)"><span>Adquirir obra</span><span class="acc-plus">+</span></button>\n    <div class="acc-body">${bodyHtml}</div>\n  </div>` }

function renderObra(id){
  const o = OBRAS[id];
  const refLinkHtml = o && o.referencia_link ? `<a class="acc-ref-link" href="${o.referencia_link.url}" target="_blank" rel="noopener">${o.referencia_link.autor} ↗</a>` : '';
  return `\n  <header class="top">\n    <div>\n      <div class="brand" onclick="location.hash=''"><span>Reflejos y</span><span>sombras</span></div>\n    </div>\n    <div>\n      <button class="theme-toggle" onclick="toggleTheme()">Tema</button>\n    </div>\n  </header>\n  <main>\n    <h1 class="titulo">${o.titulo}</h1>\n    <div class="obra-image">\n      <img class="obra-frame hidden" src="${imgSrcAt(id,0)}" srcset="${imgSrcAt(id,0)} 1x, ${imgSrcAt(id,0)} 2x" sizes="(max-width:640px) 100vw, 640px" data-imgid="${id}" data-ext-idx="0" onload="handleObraImgLoad(this,'${id}')" onerror="handleImgError(this,'obra-ph-${id}')" alt="${o.titulo}" loading="lazy">\n      <div id="obra-ph-${id}" class="placeholder">img/${id}.[jpg|png]</div>\n    </div>\n    <div class="cuerpo">${(o.obra||[]).map(p=>`<p>${p}</p>`).join('')}</div>\n    ${refLinkHtml}\n    <a id="hires-${id}" href="${imgPath(id)}" download target="_blank" class="hires-link hidden">Pulsa aquí para descargar la imagen en alta resolución ↓</a>\n  </main>\n  ${footer()}`;
}

function renderVinilo(id){ const v = VINILOS[id] || { label:'', texto:[] }; return `\n  ${header()}\n  <main>\n    <span class="label">${v.label}</span>\n    <div class="cuerpo">${v.texto.map(p=>`<p>${p}</p>`).join('')}</div>\n  </main>\n  ${footer()}` }

function renderBiografia(){
  const BIOGRAFIA = ["Texto breve de la biografía del artista."];
  return `\n  ${header()}\n  <main>\n    <span class="label">Biografía</span>\n    <h2 class="titulo">Javier Sanagustín Moreu</h2>\n    <div class="obra-image bio-image">\n      <img class="obra-frame hidden" src="${imgSrcAt('biografia',0)}" srcset="${imgSrcAt('biografia',0)} 1x, ${imgSrcAt('biografia',0)} 2x" sizes="150px" data-imgid="biografia" data-ext-idx="0" onload="handleObraImgLoad(this,'biografia')" onerror="handleImgError(this,'biografia-ph')" alt="Javier Sanagustín Moreu" loading="lazy">\n      <div id="biografia-ph" class="placeholder">img/biografia.[jpg|png]</div>\n    </div>\n    <div class="cuerpo">${BIOGRAFIA.map(p=>`<p>${p}</p>`).join('')}</div>\n    <a href="#" class="back-link">← Volver a la portada</a>\n  </main>\n  ${footer()}`;
}

function renderEpilogo(){ return `\n  ${header()}\n  <main>\n    <span class="label">Epílogo</span>\n    <div class="cuerpo" style="margin-top:20px;"><p>Gracias por visitar.</p></div>\n  </main>\n  ${footer()}` }

// Router: render into #app
function render(){ const route = getRoute(); let html = ''; if(route.type==='home') html = renderHome(); else if(route.type==='obra') html = renderObra(route.id); else if(route.type==='vinilo') html = renderVinilo(route.id); else if(route.type==='biografia') html = renderBiografia(); else if(route.type==='epilogo') html = renderEpilogo(); else html = renderHome(); document.getElementById('app').innerHTML = html; }

function toggleAcc(btn){ btn.parentElement.classList.toggle('open') }

window.addEventListener('hashchange', render);
window.addEventListener('load', ()=>{ initTheme(); render(); });

</script>
</body>
</html>
