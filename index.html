<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflejos y sombras — Javier Sanagustín Moreu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE3;
    --bg-raised: #FBF8F2;
    --fg: #1C1C1A;
    --fg-soft: #6B665C;
    --fg-faint: #A39D8F;
    --accent: #1E2A5E;
    --line: #D9D2C3;
  }
  [data-theme="dark"] {
    --bg: #14141a;
    --bg-raised: #1b1b22;
    --fg: #E8E4D8;
    --fg-soft: #948F82;
    --fg-faint: #56534a;
    --accent: #7C8CE0;
    --line: #2c2c34;
  }
  /* El reflejo siempre blanco, la sombra siempre oscura, en cualquier modo */
  .dot.reflejo { background: #FBF8F2; border: 1.3px solid #1C1C1A; }
  .dot.sombra { background: #1C1C1A; border: 1.3px solid #1C1C1A; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  .label {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }

  /* ───────── SHELL ───────── */
  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 28px 24px 18px;
  }
  .brand { font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--fg); line-height: 1.6; cursor: pointer; }
  .brand span { display: block; }
  .expo-meta { font-family: 'DM Sans', sans-serif; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-faint); text-align: right; max-width: 150px; }

  .theme-toggle {
    font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--fg-faint); background: none; border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 12px; cursor: pointer; margin-top: 10px;
  }
  .theme-toggle:hover { color: var(--fg); border-color: var(--fg-soft); }

  header.top .navrow { display:flex; gap:8px; align-items:center; }
  .navbtn {
    width: 32px; height: 32px; border: 1px solid var(--line); background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--fg-soft);
    font-family: 'DM Sans', sans-serif; font-size: 15px; border-radius: 2px;
  }
  .navbtn:disabled { opacity: .25; cursor: default; }
  .navbtn:not(:disabled):hover { color: var(--fg); border-color: var(--fg-soft); }

  main { flex: 1; padding: 6px 24px 60px; }

  footer.bottom {
    padding: 20px 24px 36px; display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid var(--line); margin-top: 40px;
  }
  .artist-sig { font-style: italic; font-size: 15px; color: var(--fg-faint); }
  .expo-dates { font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--fg-faint); }

  /* ───────── OBRA SCREEN ───────── */
  .block-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 60px; }

  .obra-image {
    width: 100%; aspect-ratio: 4/3; background: var(--bg-raised); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; margin-bottom: 34px;
  }
  .obra-image .placeholder { font-family:'DM Sans',sans-serif; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--fg-faint); }

  /* Marco adaptativo: el cuadro blanco se ajusta al formato real de cada
     obra (vertical, horizontal, cuadrado, redondo...) en vez de forzar
     todas las fotos a la misma proporción 4:3. El blanco es fijo,
     independiente del modo claro/oscuro, como un passe-partout físico. */
  .obra-frame {
    display: block; width: 100%; height: auto; padding: 18px; background: #FFFFFF;
    border: 1px solid var(--line); margin-bottom: 34px; box-sizing: border-box;
  }
  @media (min-width: 640px) { .obra-frame { padding: 28px; } }

  .tech-row {
    display: flex; justify-content: space-between; font-family: 'DM Sans', sans-serif;
    font-size: 12px; color: var(--fg-soft); padding: 10px 0; border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); margin-bottom: 28px;
  }

  h1.titulo {
    font-size: 44px; font-weight: 400; line-height: 1.15; margin-bottom: 30px; letter-spacing: -0.01em;
  }
  h1.titulo em { font-style: italic; color: var(--accent); font-weight: 400; }

  .cuerpo p { font-size: 19px; line-height: 1.65; margin-bottom: 18px; color: var(--fg); }
  .pendiente-flag {
    font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: .06em; color: #B5652A;
    border: 1px solid #B5652A55; padding: 6px 10px; display: inline-block; margin-bottom: 18px; border-radius: 3px;
  }

  .accordion { border-top: 1px solid var(--line); margin-top: 20px; }
  .acc-item { border-bottom: 1px solid var(--line); }
  .acc-head {
    width: 100%; background: none; border: none; cursor: pointer; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 0; font-family: 'DM Sans', sans-serif; font-size: 11.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--fg-faint); gap: 20px;
  }
  .acc-head .sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px;
    text-transform: none; letter-spacing: 0; color: var(--fg-soft); flex: 1; text-align: right; padding-right: 12px; }
  .acc-plus { font-size: 20px; font-weight: 300; color: var(--fg-faint); flex-shrink: 0; transition: transform .25s ease; line-height:1;}
  .acc-item.open .acc-plus { transform: rotate(45deg); }
  .acc-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .acc-item.open .acc-body { max-height: 1400px; }
  .acc-body-inner { padding: 0 0 26px; font-size: 18px; line-height: 1.65; }
  .acc-body-inner p { margin-bottom: 14px; }
  .acc-ref-link { display:inline-block; margin-top: 6px; font-family:'DM Sans',sans-serif; font-size: 11.5px;
    letter-spacing:.05em; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }

  /* ───────── HOME SCREEN ───────── */
  .home-portada {
    display:block; max-width:100%; width:auto; max-height:62vh; height:auto;
    padding: 18px; background:#FFFFFF; border: 1px solid var(--line);
    margin: 8px auto 40px; box-sizing:border-box;
  }
  @media (min-width: 640px) { .home-portada { padding: 28px; } }
  .home-portada.small { max-height: 220px; margin: 0 auto 18px; padding: 12px; }

  .vinilo { font-size: 21px; line-height: 1.6; font-style: italic; color: var(--fg); margin-bottom: 8px; }
  .vinilo-wrap { padding: 10px 0 36px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }

  .legend { display: flex; gap: 22px; align-items: center; margin: -14px 0 40px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family:'DM Sans',sans-serif; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display:inline-block; }

  .home-accordion { margin-bottom: 40px; }

  .worklist { list-style: none; margin-bottom: 44px; }
  .worklist li { border-bottom: 1px solid var(--line); }
  .worklist a {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 0; text-decoration: none; color: var(--fg);
  }
  .worklist .num { font-family:'DM Sans',sans-serif; font-size: 11px; color: var(--fg-faint); width: 20px; flex-shrink:0; }
  .worklist .name { font-style: italic; font-size: 20px; flex: 1; }
  .worklist a:hover .name { color: var(--accent); }

  .cierre-vinilo { font-style: italic; font-size: 19px; line-height: 1.6; color: var(--fg-soft);
    padding: 30px 0; border-top: 1px solid var(--line); margin-bottom: 30px; }

  .portada-revisit { text-align: center; padding: 30px 0 10px; border-top: 1px solid var(--line); }
  .portada-revisit-toggle {
    background: none; border: none; cursor: pointer; font-family:'DM Sans',sans-serif;
    font-size: 11px; letter-spacing: .08em; color: var(--fg-faint); text-transform: uppercase;
    padding: 6px 0; margin-top: 4px;
  }
  .portada-revisit-toggle:hover { color: var(--fg-soft); }
  .portada-hidden-text { max-height: 0; overflow: hidden; transition: max-height .4s ease; text-align: left; }
  .portada-hidden-text.open { max-height: 2000px; }
  .portada-hidden-text .inner { padding-top: 22px; font-size: 17.5px; line-height: 1.7; color: var(--fg-soft); }
  .portada-hidden-text .inner p { margin-bottom: 14px; }

  .catalog-btn {
    display: block; text-align: center; font-family:'DM Sans',sans-serif; font-size: 11.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--fg); text-decoration: none;
    border: 1px solid var(--line); padding: 16px; margin-top: 40px;
  }
  .catalog-btn small { display:block; font-size: 10px; color: var(--fg-faint); margin-top: 6px; letter-spacing: .04em; text-transform: none; font-style: italic; }
  .catalog-btn:hover { border-color: var(--fg-soft); }

  .hires-link {
    display: block; text-align: center; font-family:'DM Sans',sans-serif; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); text-decoration: none;
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-top: 32px;
  }
  .hires-link:hover { color: var(--fg); border-color: var(--fg-soft); }

  @media (max-width: 480px) {
    h1.titulo { font-size: 34px; }
    .cuerpo p, .acc-body-inner { font-size: 17px; }
  }

  /* ───────── VINILO (pantalla intercalada de bloque) ───────── */
  .vinilo-screen {
    min-height: 60vh; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; padding: 40px 0;
  }
  .vinilo-screen .label { margin-bottom: 26px; }
  .vinilo-screen p {
    font-style: italic; font-size: 30px; line-height: 1.5; color: var(--fg);
    max-width: 480px;
  }
  .vinilo-screen p + p { margin-top: 18px; }
  @media (max-width: 480px) {
    .vinilo-screen p { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="app"></div>
</body>
</html>
