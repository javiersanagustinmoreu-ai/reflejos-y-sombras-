<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflejos y sombras — Javier Sanagustín Moreu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE3;
    --bg-raised: #FBF8F2;
    --fg: #1C1C1A;
    --fg-soft: #6B665C;
    --fg-faint: #A39D8F;
    --accent: #1E2A5E;
    --line: #D9D2C3;
  }
  [data-theme="dark"] {
    --bg: #14141a;
    --bg-raised: #1b1b22;
    --fg: #E8E4D8;
    --fg-soft: #948F82;
    --fg-faint: #56534a;
    --accent: #7C8CE0;
    --line: #2c2c34;
  }
  /* El reflejo siempre blanco, la sombra siempre oscura, en cualquier modo */
  .dot.reflejo { background: #FBF8F2; border: 1.3px solid #1C1C1A; }
  .dot.sombra { background: #1C1C1A; border: 1.3px solid #1C1C1A; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  .label {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }

  /* ───────── SHELL ───────── */
  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 28px 24px 18px;
  }
  .brand { font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--fg); line-height: 1.6; cursor: pointer; }
  .brand span { display: block; }
  .expo-meta { font-family: 'DM Sans', sans-serif; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-faint); text-align: right; max-width: 150px; }

  .theme-toggle {
    font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--fg-faint); background: none; border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 12px; cursor: pointer; margin-top: 10px;
  }
  .theme-toggle:hover { color: var(--fg); border-color: var(--fg-soft); }

  header.top .navrow { display:flex; gap:8px; align-items:center; }
  .navbtn {
    width: 32px; height: 32px; border: 1px solid var(--line); background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--fg-soft);
    font-family: 'DM Sans', sans-serif; font-size: 15px; border-radius: 2px;
  }
  .navbtn:disabled { opacity: .25; cursor: default; }
  .navbtn:not(:disabled):hover { color: var(--fg); border-color: var(--fg-soft); }

  main { flex: 1; padding: 6px 24px 60px; }

  footer.bottom {
    padding: 20px 24px 36px; display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid var(--line); margin-top: 40px;
  }
  .artist-sig { font-style: italic; font-size: 15px; color: var(--fg-faint); }
  .expo-dates { font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--fg-faint); }

  /* ───────── OBRA SCREEN ───────── */
  .block-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 60px; }

  .obra-image {
    width: 100%; aspect-ratio: 4/3; background: var(--bg-raised); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; margin-bottom: 34px;
  }
  .obra-image .placeholder { font-family:'DM Sans',sans-serif; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--fg-faint); }

  /* Marco adaptativo: el cuadro blanco se ajusta al formato real de cada
     obra (vertical, horizontal, cuadrado, redondo...) en vez de forzar
     todas las fotos a la misma proporción 4:3. El blanco es fijo,
     independiente del modo claro/oscuro, como un passe-partout físico. */
  .obra-frame {
    display: block; width: 100%; height: auto; padding: 18px; background: #FFFFFF;
    border: 1px solid var(--line); margin-bottom: 34px; box-sizing: border-box;
  }
  @media (min-width: 640px) { .obra-frame { padding: 28px; } }

  .tech-row {
    display: flex; justify-content: space-between; font-family: 'DM Sans', sans-serif;
    font-size: 12px; color: var(--fg-soft); padding: 10px 0; border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); margin-bottom: 28px;
  }

  h1.titulo {
    font-size: 44px; font-weight: 400; line-height: 1.15; margin-bottom: 30px; letter-spacing: -0.01em;
  }
  h1.titulo em { font-style: italic; color: var(--accent); font-weight: 400; }

  .cuerpo p { font-size: 19px; line-height: 1.65; margin-bottom: 18px; color: var(--fg); }
  .pendiente-flag {
    font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: .06em; color: #B5652A;
    border: 1px solid #B5652A55; padding: 6px 10px; display: inline-block; margin-bottom: 18px; border-radius: 3px;
  }

  .accordion { border-top: 1px solid var(--line); margin-top: 20px; }
  .acc-item { border-bottom: 1px solid var(--line); }
  .acc-head {
    width: 100%; background: none; border: none; cursor: pointer; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 0; font-family: 'DM Sans', sans-serif; font-size: 11.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--fg-faint); gap: 20px;
  }
  .acc-head .sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px;
    text-transform: none; letter-spacing: 0; color: var(--fg-soft); flex: 1; text-align: right; padding-right: 12px; }
  .acc-plus { font-size: 20px; font-weight: 300; color: var(--fg-faint); flex-shrink: 0; transition: transform .25s ease; line-height:1;}
  .acc-item.open .acc-plus { transform: rotate(45deg); }
  .acc-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .acc-item.open .acc-body { max-height: 1400px; }
  .acc-body-inner { padding: 0 0 26px; font-size: 18px; line-height: 1.65; }
  .acc-body-inner p { margin-bottom: 14px; }
  .acc-ref-link { display:inline-block; margin-top: 6px; font-family:'DM Sans',sans-serif; font-size: 11.5px;
    letter-spacing:.05em; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }

  /* ───────── HOME SCREEN ───────── */
  .home-portada {
    width: 100%; aspect-ratio: 3/4; max-height: 62vh; object-fit: contain; background: var(--bg-raised);
    border: 1px solid var(--line); margin: 8px 0 40px; display:block;
  }
  .home-portada.small { max-height: 220px; aspect-ratio: auto; width: auto; margin: 0 auto 18px; display:block; }

  .vinilo { font-size: 21px; line-height: 1.6; font-style: italic; color: var(--fg); margin-bottom: 8px; }
  .vinilo-wrap { padding: 10px 0 36px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }

  .legend { display: flex; gap: 22px; align-items: center; margin: -14px 0 40px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family:'DM Sans',sans-serif; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display:inline-block; }

  .home-accordion { margin-bottom: 40px; }

  .worklist { list-style: none; margin-bottom: 44px; }
  .worklist li { border-bottom: 1px solid var(--line); }
  .worklist a {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 0; text-decoration: none; color: var(--fg);
  }
  .worklist .num { font-family:'DM Sans',sans-serif; font-size: 11px; color: var(--fg-faint); width: 20px; flex-shrink:0; }
  .worklist .name { font-style: italic; font-size: 20px; flex: 1; }
  .worklist a:hover .name { color: var(--accent); }

  .cierre-vinilo { font-style: italic; font-size: 19px; line-height: 1.6; color: var(--fg-soft);
    padding: 30px 0; border-top: 1px solid var(--line); margin-bottom: 30px; }

  .portada-revisit { text-align: center; padding: 30px 0 10px; border-top: 1px solid var(--line); }
  .portada-revisit-toggle {
    background: none; border: none; cursor: pointer; font-family:'DM Sans',sans-serif;
    font-size: 11px; letter-spacing: .08em; color: var(--fg-faint); text-transform: uppercase;
    padding: 6px 0; margin-top: 4px;
  }
  .portada-revisit-toggle:hover { color: var(--fg-soft); }
  .portada-hidden-text { max-height: 0; overflow: hidden; transition: max-height .4s ease; text-align: left; }
  .portada-hidden-text.open { max-height: 2000px; }
  .portada-hidden-text .inner { padding-top: 22px; font-size: 17.5px; line-height: 1.7; color: var(--fg-soft); }
  .portada-hidden-text .inner p { margin-bottom: 14px; }

  .catalog-btn {
    display: block; text-align: center; font-family:'DM Sans',sans-serif; font-size: 11.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--fg); text-decoration: none;
    border: 1px solid var(--line); padding: 16px; margin-top: 40px;
  }
  .catalog-btn small { display:block; font-size: 10px; color: var(--fg-faint); margin-top: 6px; letter-spacing: .04em; text-transform: none; font-style: italic; }
  .catalog-btn:hover { border-color: var(--fg-soft); }

  .hires-link {
    display: block; text-align: center; font-family:'DM Sans',sans-serif; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); text-decoration: none;
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-top: 32px;
  }
  .hires-link:hover { color: var(--fg); border-color: var(--fg-soft); }

  @media (max-width: 480px) {
    h1.titulo { font-size: 34px; }
    .cuerpo p, .acc-body-inner { font-size: 17px; }
  }

  /* ───────── VINILO (pantalla intercalada de bloque) ───────── */
  .vinilo-screen {
    min-height: 60vh; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; padding: 40px 0;
  }
  .vinilo-screen .label { margin-bottom: 26px; }
  .vinilo-screen p {
    font-style: italic; font-size: 30px; line-height: 1.5; color: var(--fg);
    max-width: 480px;
  }
  .vinilo-screen p + p { margin-top: 18px; }
  @media (max-width: 480px) {
    .vinilo-screen p { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ DATOS ============ */

// Orden real de recorrido en sala (RyS_vinilos_sala_definitivo.docx)
const ORDEN = [
  "antes-de-encontrar","luz-retenida","hacia-arriba","cerro-encendido",
  "entre-fragmentos","llanura-interior","antes-de-ver","en-el-umbral",
  "mirada-encarnada","ardiente-calma","sin-distancia","pupila-azul",
  "no-caigas","antes-de-reconocer"
];

const OBRAS = {
  "antes-de-encontrar": {
    bloque: "Apertura", titulo: "Antes de <em>encontrar</em>", clase: "sombra",
    tecnica: "Técnica mixta sobre lienzo", dimensiones: "160 × 60 cm", ano: "2021",
    obra: [
      "Este es el primer gesto, el más primitivo, el más libre, el que no tenía aún nada que demostrar. La idea de la exposición ya existía en texto, en notas, en una dirección intuida. Pero la pintura todavía no había empezado.",
      "La mancha decidió sola."
    ],
    proceso: [
      "La técnica mixta permitió lo que el óleo solo no permite. El blanco es la nieve, la mancha que da volumen al fondo desde el que todo emerge. El azul nace del lago y lo inunda todo, se expande, cruza el lienzo de lado a lado, sube hacia la mancha, cae en chorretones verticales que tensan lo que el lago quiere disolver.",
      "El negro de tinta irrumpe como una fuerza distinta, salpica, fluye, marca. Es el gesto más directo de la obra, el que no calcula ni corrige. Donde el azul se expande, el negro explota.",
      "Los árboles de la derecha nacen al revés, emergen de la mancha ya hecha, como si el paisaje se construyera desde el fondo hacia fuera."
    ],
    referencia_texto: [
      "Monet demostró que las sombras y los blancos de la nieve se llenan de color contenido. El color nace sobre el volumen ya construido en blanco. El azul inunda rápido y fluido, como el color invadía los blancos de Monet.",
      "Pero el negro es puro. Monet evitaba la ausencia con el color. Aquí se evita con el gesto, la agresividad de la mancha, el chorretón. De ahí emergen los árboles.",
      "Una sola referencia. Encontrada, no buscada."
    ],
    referencia_link: null
  },
  "luz-retenida": {
    bloque: "Bloque paisaje", titulo: "Luz <em>retenida</em>", clase: "sombra",
    tecnica: "Óleo sobre lienzo", dimensiones: "120 × 110 cm", ano: "2025",
    obra: [
      "Una mañana fría. Un paseo cualquiera por el parque, con los edificios cercanos bloqueando la luz. Entre esa penumbra, haces de luz esquivaban los obstáculos y revelaban pequeñas zonas de color, no calentaban pero mostraban.",
      "Así apareció, un tulipán rojo, único, despierto entre líneas finas de verde y azul, entre compañeras aún apagadas.",
      "La realidad que interesaba no era botánica. Era pictórica."
    ],
    proceso: [
      "La obra se construyó desde el recuerdo. Lo que guió el pincel fue la sensación, el peso del follaje, la tensión de los verdes sucios amenazando con devorarlo todo, el frío que lo envolvía todo menos a él.",
      "El empaste es deliberadamente denso, casi difícil de mover. Las sombras son rosas sucias, los rojos oscuros, los verdes casi negros. Todo contiene, todo encierra, hasta que el tulipán central rompe el empaste con una pincelada de rojo cadmio sin mezclar."
    ],
    referencia_texto: [
      "Agapanthus pertenece a las grandes décorations. Monet las pintó en el estudio que construyó en Giverny durante los últimos años de su vida, con el agua de los estanques rodeándolo y con las cataratas alterando su percepción del color. Son obras de memoria acumulada, de décadas mirando el mismo estanque hasta que el motivo dejó de ser exterior y pasó a ser completamente interior.",
      "Eso es lo que conecta con Luz retenida. Es la decisión de pintar desde lo que quedó. La fotografía capturó el tulipán. La pintura lo reconstruyó desde la sensación. Monet no necesitaba ver el estanque para pintarlo. Llevaba décadas dentro de él."
    ],
    referencia_link: { autor: "Claude Monet — Agapanthus", url: "https://www.moma.org/collection/works/79922" }
  },
  "hacia-arriba": {
    bloque: "Bloque paisaje", titulo: "Hacia <em>arriba</em>", clase: "sombra",
    tecnica: "Óleo sobre tabla", dimensiones: "Ø 80 cm", ano: "2022",
    obra: [
      "Mirar hacia arriba. Quería pasear y mirar como Van Gogh en sus almendros en flor. No el árbol, desde dentro del árbol.",
      "El formato amplía esa mirada como lo haría el ojo, sin esquinas, sin límites, sin horizonte. Solo cielo y ramas. Dos árboles. Sin separarse. No sabía si intentando tocarse o evitarse. Pero ahí estaban, en el centro, con esa tensión que no se resuelve. Y solo el viento se atreve a juntarlos."
    ],
    proceso: [
      "Las líneas son moradas. Las hojas no se describen, se sugieren, cada una un gesto rápido. El azul del cielo no es fondo neutro sino presencia activa que respira entre la maraña de ramas.",
      "En el centro, casi sin querer, dos ramas avanzan la una hacia la otra sin llegar a tocarse."
    ],
    referencia_texto: [
      "Van Gogh pintó los almendros en flor, llenó el lienzo de ramas contra el cielo. Lo pintó como regalo, por una vida que empezaba. Aquí no hay esquinas, no hay límites, no hay horizonte. Solo cielo y ramas. Estar dentro del árbol, no mirarlo desde fuera, como quien vuelve a nacer dentro de algo que ya estaba ahí.",
      "Hay un segundo gesto escondido entre las ramas. Dos formas que avanzan sin tocarse. Si no lo buscas, no lo ves. Pero está ahí, como lleva siglos estando en el techo de la Capilla Sixtina."
    ],
    referencia_link: { autor: "Vincent van Gogh — Almendro en flor", url: "https://historia-arte.com/obras/almendro-en-flor-de-van-gogh" }
  },
  "cerro-encendido": {
    bloque: "Bloque paisaje", titulo: "Cerro <em>encendido</em>", clase: "sombra",
    tecnica: "Óleo sobre lienzo", dimensiones: "100 × 70 cm", ano: "2025",
    obra: [
      "Una tarde saliendo del Alcoraz. El cerro de San Jorge, con la luz encendiéndolo todo. No incendiado pero igualmente violento. El naranja tiñendo los árboles desde dentro, como si la luz viniera del interior del cerro.",
      "El contraste obliga. El azul frío y denso del bosque hace que el naranja de las ramas no tenga otra opción que gritar."
    ],
    proceso: [
      "Los troncos grandes anclan la composición verticalmente, pesados, casi arquitectónicos. Pero conforme bajan hacia el suelo se aligeran, pierden definición, se convierten en líneas, en chorreras, en gestos sin detalle. La pintura se adelgaza donde la realidad se vuelve menos importante. Esa diferencia de materia crea profundidad sin necesidad de perspectiva.",
      "El azul es una decisión emocional, ultramar y prusia mezclados en distintas densidades, algunos pasajes casi negros, otros casi eléctricos. El naranja de las ramas delgadas trabaja por vibración, la pareja cromática de máxima tensión. Juntos no descansan."
    ],
    referencia_texto: [
      "Mondrian pintó el árbol ardiendo desde la raíz. El rojo sube desde la tierra, el azul lo rodea por todas partes sin apagarlo. Un árbol que no arde por fuera sino desde dentro.",
      "Yo buscaba exactamente eso. Tenía el recuerdo del cerro y necesitaba la sensación de color que lo contara. En Mondrian encontré ese instante, cuando el color ya no describe sino que quema."
    ],
    referencia_link: { autor: "Piet Mondrian — El árbol rojo", url: "https://commons.wikimedia.org/wiki/File:Piet_Mondrian,_1908-10,_Evening;_Red_Tree_(Avond;_De_rode_boom),_oil_on_canvas,_70_x_99_cm,_Gemeentemuseum_Den_Haag.jpg" }
  },
  "entre-fragmentos": {
    bloque: "Bloque paisaje", titulo: "Entre <em>fragmentos</em>", clase: "sombra",
    tecnica: "Óleo sobre lienzo · Políptico", dimensiones: "348 × 178 cm", ano: "2026",
    obra: [
      "Este sauce lleva años en el Parque de las Olas. Una arquitectura viva que crece hasta dejarse caer.",
      "Y no bastaba una pequeña mirada.",
      "Aquí hay algo que solo ocurre cuando estás a sus pies. No viéndolo desde lejos, no en una foto. A sus pies. Una calidez que no viene del árbol sino de dentro de ti, que sube despacio, que pesa. Donde las ramas caen hacia ti, cubriéndote."
    ],
    proceso: [
      "El azul en zonas planas para que el protagonismo sea de las ramas. Los verdes saturados caen del árbol. El naranja es lo que sale de ti, lo que el cuerpo genera al estar a sus pies. Dos fuerzas que avanzan la una hacia la otra en ese tronco que estructura y enraíza el caos sin domesticarlo.",
      "Al pintarlo entendí algo que no sabía antes de empezar, que esa calidez no es solo mía, que él también la siente."
    ],
    referencia_texto: [
      "Hockney volvió a Yorkshire después de años en California. Pintó sus caminos, sus árboles en distintos momentos, con luces distintas. Los colores que la naturaleza le hacía sentir sin ser fiel a la realidad.",
      "En eso lo reconocí. El azul que no es descriptivo. El naranja que no es del árbol. El color como única manera honesta de decir lo que ocurre cuando estás dentro de un paisaje que te pertenece.",
      "Pensó en mirar un cuadro como se mira un paisaje. Varios lienzos a la vez, el ojo no se queda quieto frente a un solo marco, salta de uno a otro, busca, reconstruye. Así se mira un paisaje. Un solo lienzo habría contenido el árbol. Seis fragmentos lo habitan."
    ],
    referencia_link: { autor: "David Hockney — El bosque de Woldgate", url: "https://www.guggenheim-bilbao.eus/exposicion/el-bosque-de-woldgate-21-23-y-29-de-noviembre-de-2006" }
  },
  "llanura-interior": {
    bloque: "Bloque paisaje", titulo: "Llanura <em>interior</em>", clase: "sombra",
    tecnica: "Óleo sobre lienzo", dimensiones: "102 × 194 cm", ano: "2026",
    obra: [
      "Este paisaje no existe. Son fragmentos, distancias imposibles, recuerdos que ya olvidaron su origen. No hay un punto exacto desde el que mirar porque no se busca un lugar, se busca la imagen que queda cuando la memoria ha terminado su trabajo.",
      "Mares de ocre quebrados por islotes verdes. Tozales que emergen sin estridencia. Una carrasca en el centro que no es presencia sino insistencia, un punto donde algo propio se vuelve reconocible. Verde tierra que vira a amarillo. Aragón.",
      "Y siempre, serpenteando, una línea que conduce la mirada hasta donde termina todo, la sierra. Demasiado presente. Como sucede en la memoria cuando algo se vuelve inevitable."
    ],
    proceso: [
      "La mancha debía decidir antes que el pincel. Dejé que el paisaje emocional emergiera. La luz naranja brota desde la base como fuego interno que contamina sin destruir.",
      "La sierra rompe la escala sin aviso. La copa de la carrasca se descompone en los verdes y amarillos del fondo. El tronco está desconectado de su propia sombra. La sombra cambia de dirección. La lógica del paisaje se fractura.",
      "Es un paisaje que se reconoce."
    ],

/* ============ IMÁGENES ============
   Coloca los archivos con estos nombres en una carpeta /img junto a este
   archivo y aparecerán automáticamente. Mientras no existan, se ve el
   hueco vacío con el nombre de archivo esperado. */
const IMG_EXTS = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG'];
function imgSrcAt(id, i) { return `img/${id}.${IMG_EXTS[i]}`; }
// Compatibilidad con el resto del código: primer intento por defecto.
function imgPath(id) { return imgSrcAt(id, 0); }
const PORTADA_IMG = imgSrcAt('portada', 0);

// Si una imagen no carga, prueba la siguiente extensión de la lista
// (jpg, JPG, jpeg, JPEG, png, PNG) antes de rendirse. Así da igual en
// qué formato subas cada foto, mientras el NOMBRE (sin extensión) sea
// el correcto.
function handleImgError(img, phId) {
  const i = (parseInt(img.dataset.extIdx || '0', 10)) + 1;
  if (i < IMG_EXTS.length) {
    img.dataset.extIdx = String(i);
    img.src = imgSrcAt(img.dataset.imgid, i);
  } else if (phId) {
    img.style.display = 'none';
    const ph = document.getElementById(phId);
    if (ph) ph.style.display = 'flex';
  }
}
function handleObraImgLoad(img, id) {
  img.style.display = 'block';
  img.nextElementSibling.style.display = 'none';
  const hires = document.getElementById('hires-' + id);
  if (hires) { hires.href = img.src; hires.style.display = 'inline-block'; }
}

function getRoute() {
  const hash = location.hash.replace('#', '');
  if (!hash || hash === '/') return { type: 'home' };
  if (OBRAS[hash]) return { type: 'obra', id: hash };
  if (VINILOS[hash]) return { type: 'vinilo', id: hash };
  if (hash === 'pieza-umbral-revelada') return { type: 'final', id: hash };
  if (hash === 'biografia') return { type: 'biografia' };
  if (hash === 'epilogo') return { type: 'epilogo' };
  if (hash === 'catalogo') return { type: 'catalogo' };
  return { type: 'home' };
}

// Busca el vecino anterior/siguiente en la secuencia real de recorrido,
// sea obra o vinilo, a partir de cualquier id de la secuencia.
function seqNeighbors(id) {
  const idx = SEQUENCE.findIndex(item => item.id === id);
  if (idx === -1) return { prev: null, next: null };
  return {
    prev: idx > 0 ? SEQUENCE[idx - 1] : null,
    next: idx < SEQUENCE.length - 1 ? SEQUENCE[idx + 1] : null
  };
}

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('rys-theme', t);
}
function initTheme() {
  const saved = localStorage.getItem('rys-theme');
  if (saved) { setTheme(saved); return; }
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(prefersDark ? 'dark' : 'light');
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
}

            <th style="text-align:left; padding:8px; font-family:'DM Sans',sans-serif; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-faint);">Técnica</th>
            <th style="text-align:left; padding:8px; font-family:'DM Sans',sans-serif; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-faint);">Medidas</th>
            <th style="text-align:left; padding:8px; font-family:'DM Sans',sans-serif; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-faint);">Año</th>
            <th style="text-align:left; padding:8px;"></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <a href="#" style="display:inline-block; margin-top:30px; font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-soft); border-bottom:1px solid var(--line);">← Volver a la portada</a>
  </main>
  ${footer()}
  `;
}

function render() {
  const route = getRoute();
  const app = document.getElementById('app');
  if (route.type === 'obra') {
    app.innerHTML = renderObra(route.id);
  } else if (route.type === 'vinilo') {
    app.innerHTML = renderVinilo(route.id);
  } else if (route.type === 'final') {
    app.innerHTML = renderFinal(route.id);
  } else if (route.type === 'biografia') {
    app.innerHTML = renderBiografia();
  } else if (route.type === 'epilogo') {
    app.innerHTML = renderEpilogo();
  } else if (route.type === 'catalogo') {
    app.innerHTML = renderCatalogo();
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);
initTheme();
render();
</script>
</body>
</html>
