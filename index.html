<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #F2EDE3;
        --bg-raised: #FBF8F2;
        --fg: #1C1C1A;
        --fg-soft: #6B665C;
        --fg-faint: #A39D8F;
        --accent: #1E2A5E;
        --line: #D9D2C3;
      }
      [data-theme="dark"] {
        --bg: #14141a;
        --bg-raised: #1b1b22;
        --fg: #E8E4D8;
        --fg-soft: #948F82;
        --fg-faint: #56534a;
        --accent: #7C8CE0;
        --line: #2c2c34;
      }
      .dot.reflejo { background: #FBF8F2; border: 1.3px solid #1C1C1A; }
      .dot.sombra { background: #1C1C1A; border: 1.3px solid #1C1C1A; }
      
      * { margin: 0; padding: 0; box-sizing: border-box; }img { max-width: 100%; height: auto; display: block; }

.home-portada {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  margin-bottom: 40px;
}
.home-portada.small {
  aspect-ratio: 1/1;
  margin-bottom: 20px;
}
      html { scroll-behavior: smooth; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: 'Cormorant Garamond', serif;
        font-weight: 400;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        transition: background .3s ease, color .3s ease;
      }
      .label { font-family: 'DM Sans', sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-faint); }
      #app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
      header.top { display: flex; justify-content: space-between; align-items: flex-start; padding: 28px 24px 18px; }
      .brand { font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg); line-height: 1.6; cursor: pointer; }
      .brand span { display:block }
      .expo-meta { font-family: 'DM Sans', sans-serif; font-size: 10.5px; color: var(--fg-faint); text-align:right }
      .theme-toggle { font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-faint); background: none; border: 1px solid var(--line); border-radius: 20px; padding: 5px 12px; cursor: pointer; margin-top: 10px; }
      .navrow { display:flex; gap:8px; align-items:center }
      .navbtn { width: 32px; height: 32px; border: 1px solid var(--line); background: none; cursor: pointer; display:flex; align-items:center; justify-content:center; color:var(--fg-soft); font-family:'DM Sans',sans-serif }
      main { flex:1; padding: 6px 24px 60px; }
      footer.bottom { padding: 20px 24px 36px; display:flex; justify-content:space-between; border-top:1px solid var(--line); margin-top:40px }
      .artist-sig { font-style: italic; font-size: 15px; color: var(--fg-faint); }
      .expo-dates { font-family:'DM Sans',sans-serif; font-size:10px; color:var(--fg-faint) }
      .obra-image { width:100%; aspect-ratio:4/3; background:var(--bg-raised); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; margin-bottom:34px }
      .obra-image .placeholder { font-family:'DM Sans',sans-serif; font-size:10.5px; color:var(--fg-faint); text-transform:uppercase }
      .obra-frame { display:block; width:100%; height:auto; padding:18px; background:#fff; border:1px solid var(--line); margin-bottom:34px }
      .tech-row { display:flex; justify-content:space-between; font-family:'DM Sans',sans-serif; font-size:12px; color:var(--fg-soft); padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:28px }
      h1.titulo { font-size:44px; margin-bottom:30px }
      .cuerpo p { font-size:19px; line-height:1.65; margin-bottom:18px }
      .accordion { border-top:1px solid var(--line); margin-top:20px }
      .acc-head { width:100%; background:none; border:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding:18px 0; font-family:'DM Sans',sans-serif; font-size:11.5px; color:var(--fg-faint) }
      .acc-body { max-height:0; overflow:hidden; transition:max-height .35s ease }
      .acc-item.open .acc-body { max-height:1400px }
      .catalog-btn { display:block; text-align:center; font-family:'DM Sans',sans-serif; font-size:11.5px; border:1px solid var(--line); padding:16px; margin-top:40px; text-decoration:none; color:var(--fg) }
      .legend { display:flex; gap:22px; margin:-14px 0 40px }
      .dot { width:9px; height:9px; border-radius:50% }
    </style>
  </head>

];

const IMG_EXTS = ['jpg','JPG','jpeg','JPEG','png','PNG'];
function imgSrcAt(id,i){ return `img/${id}.${IMG_EXTS[i]}` }
function imgPath(id){ return imgSrcAt(id,0) }
const PORTADA_IMG = imgSrcAt('portada',0);

function handleImgError(img, phId) {
  try {
    const currentIdx = parseInt(img.dataset.extIdx ?? img.getAttribute('data-ext-idx') ?? '0', 10);
    const i = currentIdx + 1;
    if (i < IMG_EXTS.length) {
      img.dataset.extIdx = String(i);
      const imgid = img.dataset.imgid ?? img.getAttribute('data-imgid') ?? '';
      if (imgid) {
        img.src = imgSrcAt(imgid, i);
      } else {
        console.warn('handleImgError: no data-imgid on element, cannot try next extension');
        img.style.display = 'none';
        if (phId) { const ph = document.getElementById(phId); if (ph) ph.style.display = 'flex'; }
      }
    } else {
      img.style.display = 'none';
      if (phId) { const ph = document.getElementById(phId); if (ph) ph.style.display = 'flex'; }
    }
  } catch (e) {
    console.error('handleImgError failed', e);
  }
}
function handleObraImgLoad(img, id) {
  try {
    img.style.display = 'block';
    if (img.nextElementSibling) img.nextElementSibling.style.display = 'none';
    const hires = document.getElementById('hires-' + id);
    if (hires) { hires.href = img.src; hires.style.display = 'inline-block'; }
  } catch (e) {
    console.error('handleObraImgLoad failed', e);
  }
}

function getRoute(){ const hash = location.hash.replace('#',''); if(!hash||hash==='/') return {type:'home'}; if(OBRAS[hash]) return {type:'obra', id:hash}; if(VINILOS[hash]) return {type:'vinilo', id:hash}; if(hash==='pieza-umbral-revelada') return {type:'final', id:hash}; if(hash==='biografia') return {type:'biografia'}; if(hash==='epilogo') return {type:'epilogo'}; if(hash==='catalogo') return {type:'catalogo'}; return {type:'home'} }
function seqNeighbors(id){ const idx = SEQUENCE.findIndex(item => item.id===id); if(idx===-1) return {prev:null,next:null}; return { prev: idx>0 ? SEQUENCE[idx-1] : null, next: idx < SEQUENCE.length-1 ? SEQUENCE[idx+1] : null } }

function setTheme(t){ document.documentElement.setAttribute('data-theme', t); localStorage.setItem('rys-theme', t) }
function initTheme(){ const saved = localStorage.getItem('rys-theme'); if(saved){ setTheme(saved); return } const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; setTheme(prefersDark ? 'dark' : 'light') }
function toggleTheme(){ const cur = document.documentElement.getAttribute('data-theme'); setTheme(cur==='dark' ? 'light' : 'dark') }

function header(){ return `
    <header class="top">
      <div>
        <div class="brand" onclick="location.hash=''">

      </div>
      <div class="expo-meta">Palacio de Villahermosa · Huesca · 2026</div>

function footer(){ return `
    <footer class="bottom">
      <span class="artist-sig">Javier Sanagustín Moreu</span>
      <span class="expo-dates">Huesca · 8 oct – 11 nov 2026</span>
    </footer>` }
const CATALOG_URL = null;
function catalogBtn(){ const url = CATALOG_URL || '#'; const disabledAttr = CATALOG_URL ? '' : ' onclick="event.preventDefault(); alert(\'El catálogo todavía no está disponible para comprar.\');"'; return `<a class="catalog-btn" href="${url}"${CATALOG_URL ? ' target="_blank" rel="noopener"' : ''}${disabledAttr}>Adquirir catálogo<small>Comprarlo es apoyar directamente este proyecto.</small></a>` }

function renderHome(){
const worklistHtml = ORDEN.map((id,i)=>{ const o = OBRAS[id]; const dotHtml = o.clase ? `<span class="dot ${o.clase}"></span>` : ''; return `<li><a href="#${id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="name">${o.titulo.replace(/<\/?em>/g,'')}</span>${dotHtml}</a></li>` }).join('');
return `
    ${header()}
    <main>
      <img class="home-portada" src="${PORTADA_IMG}" data-imgid="portada" data-ext-idx="0" alt="" onerror="handleImgError(this, 'portada-ph')">

        <span class="placeholder">img/portada.jpg</span>
      </div>
      <div class="vinilo-wrap">
        <p class="vinilo">${VINILO_APERTURA}</p>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="dot reflejo"></span>Reflejo</span>
        <span class="legend-item"><span class="dot sombra"></span>Sombra</span>
      </div>
      <ul class="worklist">${worklistHtml}</ul>
      <a class="catalog-btn" href="#biografia" style="margin-top:40px;">Biografía<small>Sobre Javier Sanagustín Moreu y la escuela.</small></a>
      <a class="catalog-btn" href="#catalogo" style="margin-top:14px;">Catálogo de obra<small>Técnica, medidas y año de las catorce obras.</small></a>
      ${catalogBtn()}
    </main>
    ${footer()}
  ` }

function adquirirObraAcc(id){ const info = { precio:null, disponible:false }; let bodyHtml = `<p style="color:var(--fg-faint); font-style:italic;">Información de venta no disponible.</p>`;
return `
    <div class="acc-item" data-acc="adquirir-${id}">
      <button class="acc-head" onclick="toggleAcc(this)"><span>Adquirir obra</span><span class="acc-plus">+</span></button>
      <div class="acc-body"><div class="acc-body-inner">${bodyHtml}</div></div>
    </div>` }

function renderObra(id){ const o = OBRAS[id]; const idx = ORDEN.indexOf(id); const {prev,next} = seqNeighbors(id);
const refLinkHtml = o.referencia_link ? `<a class="acc-ref-link" href="${o.referencia_link.url}" target="_blank" rel="noopener">${o.referencia_link.autor} ↗</a>` : '';
return `
    <header class="top">
      <div>
        <div class="brand" onclick="location.hash=''"><span>Reflejos y</span><span>sombras</span></div>
        <button class="theme-toggle" onclick="toggleTheme()">Modo</button>
      </div>
      <div class="navrow">
        <button class="navbtn" ${prev?`onclick="location.hash='${prev.id}'"`:'disabled'}>‹</button>

      </div>
    </header>
    <main>
      <div class="block-row">
        <span class="label">${o.bloque}</span>
        <span class="label">${String(idx+1).padStart(2,'0')} / ${ORDEN.length}</span>
      </div>
      <img class="obra-frame" style="display:none;" src="${imgSrcAt(id,0)}" data-imgid="${id}" data-ext-idx="0" onload="handleObraImgLoad(this, '${id}')" onerror="handleImgError(this,'obra-ph')" alt="">
      <div id="obra-ph" class="obra-image">
        <span class="placeholder">img/${id}.[jpg|png]</span>
      </div>
      <div class="tech-row"><span>${o.tecnica}</span><span>${o.dimensiones}</span></div>

      <div class="cuerpo">${o.obra.map(p=>`<p>${p}</p>`).join('')}</div>
      <div class="accordion">
        <div class="acc-item" data-acc="proceso-${id}">
          <button class="acc-head" onclick="toggleAcc(this)"><span>El proceso</span><span class="acc-plus">+</span></button>

      <a id="hires-${id}" href="${imgPath(id)}" download target="_blank" class="hires-link" style="display:none;">Pulsa aquí para descargar la imagen en alta resolución ↓</a>

  ` }

  ` }

function toggleAcc(btn){ btn.parentElement.classList.toggle('open') }
function togglePortada(){ const el = document.getElementById('portada-hidden'); if(el) el.classList.toggle('open') }

function renderBiografia(){ return `
    ${header()}
    <main>
      <span class="label">Biografía</span>
      <h1 class="titulo" style="font-size:34px; margin-top:14px;">Javier Sanagustín Moreu</h1>
      <div class="obra-image" style="width:150px; max-width:45%; aspect-ratio:3/4; margin:22px 0 26px;">
        <span class="placeholder" style="font-size:9px; text-align:center; padding:6px;">img/biografia.[jpg|png]</span>
      </div>
      <div class="cuerpo"><p>Biografía (resumida).</p></div>
      ${catalogBtn()}
    </main>
    ${footer()}
  ` }

function renderEpilogo(){ const {prev,next} = seqNeighbors('epilogo'); return `
    ${header()}
    <main>
      <span class="label">Epílogo</span>
      <div class="cuerpo" style="margin-top:20px; font-style:italic;">
        ${EPILOGO.map(p=>`<p>${p}</p>`).join('')}
        <p style="margin-top:26px; font-size:22px;">${EPILOGO_FINAL}</p>
      </div>
      ${catalogBtn()}
    </main>
    ${footer()}
  ` }

function render(){ const route = getRoute(); let html = '';
if(route.type==='home') html = renderHome();
else if(route.type==='obra') html = renderObra(route.id);
else if(route.type==='vinilo') html = renderVinilo(route.id);
else if(route.type==='final') html = renderFinal(route.id);
else if(route.type==='biografia') html = renderBiografia();
else if(route.type==='epilogo') html = renderEpilogo();
else html = renderHome();
document.getElementById('app').innerHTML = html;
}

window.addEventListener('hashchange', render);
window.addEventListener('load', ()=>{ initTheme(); render(); });

</script>
</body>
</html>
