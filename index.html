<style>
  :root {
    --bg: #F2EDE3;
    --bg-raised: #FBF8F2;

  .dot.reflejo { background: #FBF8F2; border: 1.3px solid #1C1C1A; }
  .dot.sombra { background: #1C1C1A; border: 1.3px solid #1C1C1A; }

  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 28px 24px 18px;
  }
  .brand { font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.16em;

  .expo-meta { font-family: 'DM Sans', sans-serif; font-size: 10.5px; letter-spacing: 0.08em;

  .theme-toggle {
    font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;

  header.top .navrow { display:flex; gap:8px; align-items:center; }
  .navbtn {
    width: 32px; height: 32px; border: 1px solid var(--line); background: none; cursor: pointer;

  main { flex: 1; padding: 6px 24px 60px; }

  .artist-sig { font-style: italic; font-size: 15px; color: var(--fg-faint); }
  .expo-dates { font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--fg-faint); }

  /* ───────── OBRA SCREEN ───────── */
  .block-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 60px; }

  .obra-frame {
    display: flex; justify-content: center; margin-bottom: 34px;

  .obra-frame.is-placeholder {

  .acc-plus { font-size: 20px; font-weight: 300; color: var(--fg-faint); flex-shrink: 0; transition: transform .25s ease; line-height:1;}

  .acc-ref-link { display:inline-block; margin-top: 6px; font-family:'DM Sans',sans-serif; font-size: 11.5px;
    letter-spacing:.05em; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }

  /* ───────── HOME SCREEN ───────── */
  .home-portada {

  .home-portada.small { max-height: 220px; aspect-ratio: auto; width: auto; margin: 0 auto 18px; display:block; }

  .vinilo { font-size: 21px; line-height: 1.6; font-style: italic; color: var(--fg); margin-bottom: 8px; }
  .vinilo-wrap { padding: 10px 0 36px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }

  .legend { display: flex; gap: 22px; align-items: center; margin: -14px 0 40px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family:'DM Sans',sans-serif; font-size: 11px;

  .home-accordion { margin-bottom: 40px; }

  .worklist { list-style: none; margin-bottom: 44px; }
  .worklist li { border-bottom: 1px solid var(--line); }
  .worklist a {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 16px 0; text-decoration: none; color: var(--fg);
  }
  .worklist .num { font-family:'DM Sans',sans-serif; font-size: 11px; color: var(--fg-faint); width: 20px; flex-shrink:0; }
  .worklist .name { font-style: italic; font-size: 20px; flex: 1; }
  .worklist a:hover .name { color: var(--accent); }

  .cierre-vinilo { font-style: italic; font-size: 19px; line-height: 1.6; color: var(--fg-soft);
    padding: 30px 0; border-top: 1px solid var(--line); margin-bottom: 30px; }

  .portada-revisit { text-align: center; padding: 30px 0 10px; border-top: 1px solid var(--line); }
  .portada-revisit-toggle {

    padding: 6px 0; margin-top: 4px;

  .portada-revisit-toggle:hover { color: var(--fg-soft); }
  .portada-hidden-text { max-height: 0; overflow: hidden; transition: max-height .4s ease; text-align: left; }
  .portada-hidden-text.open { max-height: 2000px; }
  .portada-hidden-text .inner { padding-top: 22px; font-size: 17.5px; line-height: 1.7; color: var(--fg-soft); }
  .portada-hidden-text .inner p { margin-bottom: 14px; }

  .catalog-btn {
    display: block; text-align: center; font-family:'DM Sans',sans-serif; font-size: 11.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--fg); text-decoration: none;
    border: 1px solid var(--line); padding: 16px; margin-top: 40px;
  }
  .catalog-btn small { display:block; font-size: 10px; color: var(--fg-faint); margin-top: 6px; letter-spacing: .04em; text-transform: none; font-style: italic; }
  .catalog-btn:hover { border-color: var(--fg-soft); }

  .hires-link {
    display: block; text-align: center; font-family:'DM Sans',sans-serif; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); text-decoration: none;
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-top: 32px;
  }
  .hires-link:hover { color: var(--fg); border-color: var(--fg-soft); }

  @media (max-width: 480px) {
    h1.titulo { font-size: 34px; }
    .cuerpo p, .acc-body-inner { font-size: 17px; }
  }

  /* ───────── VINILO (pantalla intercalada de bloque) ───────── */
  .vinilo-screen {
    min-height: 60vh; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; padding: 40px 0;
  }
  .vinilo-screen .label { margin-bottom: 26px; }
  .vinilo-screen p {
    font-style: italic; font-size: 30px; line-height: 1.5; color: var(--fg);
    max-width: 480px;
  }
  .vinilo-screen p + p { margin-top: 18px; }
  @media (max-width: 480px) {
    .vinilo-screen p { font-size: 24px; }
  }
</style>

<script>

// Orden real de recorrido en sala (RyS_vinilos_sala_definitivo.docx)
const ORDEN = [

  "entre-fragmentos","llanura-interior","antes-de-ver","en-el-umbral",

  "no-caigas","antes-de-reconocer"

const OBRAS = {
  "antes-de-encontrar": {
    bloque: "Apertura", titulo: "Antes de <em>encontrar</em>", clase: "sombra",
    tecnica: "Técnica mixta sobre lienzo", dimensiones: "160 × 60 cm",
    obra: [
      "Esta fue la primera obra. La idea de la exposición ya existía en texto, en notas, en una dirección intuida. Pero la pintura todavía no había empezado. Este es el primer gesto, el más primitivo, el más libre, el que no tenía aún nada que demostrar.",
      "La mancha decidió sola."
    ],
    proceso: [
      "La técnica mixta permitió lo que el óleo solo no permite, velocidad, accidente, capas que no se planean. El blanco es la nieve, la mancha que ya estaba, el fondo desde el que todo emerge. El azul nace del lago y lo invade todo, se expande horizontalmente, cruza el lienzo de lado a lado, sube hacia la mancha, cae en chorretones verticales que tensan lo que el lago quiere disolver.",
      "El negro de tinta irrumpe como una fuerza distinta. No construye ni modela, salpica, fluye, marca. Es el gesto más directo de la obra, el que no calcula ni corrige. Donde el azul se expande, el negro explota.",
      "Los árboles de la derecha nacen al revés, emergen de la mancha ya hecha, como si el paisaje se construyera desde el fondo hacia fuera."
    ],
    referencia_texto: [
      "Monet demostró que las sombras no son negras, son azules. Que el blanco de la nieve no es ausencia sino presencia activa, llena de color contenido. Sus paisajes nevados no describen el frío, lo construyen con la temperatura del color.",
      "Aquí esa misma lógica opera desde el gesto. El blanco no es fondo vacío. El azul no es un color decorativo. El lago invade la nieve como la emoción invade la calma.",
      "Una sola referencia. Encontrada, no buscada."
    ],
    referencia_link: null
  },
  "luz-retenida": {
    bloque: "Bloque paisaje", titulo: "Luz <em>retenida</em>", clase: "sombra",
    tecnica: "Óleo sobre lienzo", dimensiones: "120 × 110 cm",
    obra: [
      "Una mañana fría. Un paseo cualquiera por el parque, con los edificios cercanos bloqueando la luz. Entre esa penumbra, haces de luz esquivaban los obstáculos y revelaban pequeñas zonas de color, no calentaban, pero mostraban.",
      "Así apareció, un tulipán rojo, único, despierto entre líneas finas de verde y azul, entre compañeras aún apagadas. Gritaba como la primera voz de una casa al amanecer. Ruido. Presencia.",
      "La realidad que interesaba no era botánica. Era pictórica."
    ],
    proceso: [
      "La obra se construyó desde el recuerdo, no desde la imagen. La fotografía capturó el instante, pero lo que guió el pincel fue la sensación, el peso del follaje, la tensión de los verdes sucios amenazando con devorarlo todo, el frío que lo envolvía todo menos a él.",
      "El empaste es deliberadamente denso, casi difícil de mover. El color cuesta. Las sombras son rosas sucias, los rojos oscuros, los verdes casi negros. Todo contiene, todo encierra, hasta que el tulipán central rompe. Ahí el color no se ensucia, vibra."
    ],
    referencia_texto: [
      "Agapanthus pertenece a las grandes décorations que Monet pintó en el estudio que construyó en Giverny durante sus últimos años, con las cataratas alterando su percepción del color. Los rojos se volvían turbios, los rosas insípidos, todo viraba hacia el amarillo. No son obras de observación directa. Son obras de memoria acumulada, décadas mirando el mismo estanque hasta que el motivo dejó de ser exterior y pasó a ser completamente interior.",
      "Eso es lo que conecta con Luz retenida. No la escala, no el motivo vegetal, la decisión de pintar desde lo que quedó. La fotografía capturó el tulipán. La pintura lo reconstruyó desde la sensación. Monet no necesitaba ver el estanque para pintarlo. Llevaba décadas dentro de él."
    ],
    referencia_link: { autor: "Claude Monet — Agapanthus", url: "https://www.moma.org/collection/works/79922" }
  },
  "hacia-arriba": {
    bloque: "Bloque paisaje", titulo: "Hacia <em>arriba</em>", clase: "sombra",
    tecnica: "Óleo sobre tabla", dimensiones: "80 cm diámetro",
    obra: [
      "Mirar hacia arriba. Quería pasear y mirar como Van Gogh en sus almendros en flor. No el árbol, desde dentro del árbol.",
      "El formato amplía esa mirada como lo haría el ojo, sin esquinas, sin límites, sin horizonte. Solo cielo y ramas. Dos árboles. Sin separarse. No sabía si intentando tocarse o evitarse. Pero ahí estaban, en el centro, con esa tensión que no se resuelve. Y solo el viento se atreve a juntarlos."
    ],
    proceso: [
      "Las líneas son moradas. Las hojas no se describen, se sugieren, cada una un gesto rápido. El azul del cielo no es fondo neutro sino presencia activa que respira entre la maraña de ramas.",
      "En el centro, casi sin querer, dos ramas avanzan la una hacia la otra sin llegar a tocarse. Con esa tensión quieta de lo que está a punto de ocurrir y no ocurre."
    ],
    referencia_texto: [
      "Van Gogh pintó los almendros en flor contra el cielo azul como un gesto de celebración, la rama como línea viva, la flor como punto de luz, el árbol como símbolo de comienzo. Aquí esa misma mirada se interioriza, no la belleza del árbol sino la experiencia de estar dentro de él, mirando hacia donde él mira.",
      "Hay un segundo gesto escondido entre las ramas. Dos formas que avanzan sin tocarse, separadas por el espacio exacto que hace que la tensión exista. Si no lo buscas, no lo ves. Pero está ahí, en el centro de la obra, como lleva siglos estando en el techo de la Capilla Sixtina."
    ],
    referencia_link: { autor: "Vincent van Gogh — Almendro en flor / Miguel Ángel — La creación de Adán", url: "https://historia-arte.com/obras/almendro-en-flor-de-van-gogh" }
  },
  "cerro-encendido": {
    bloque: "Bloque paisaje", titulo: "Cerro <em>encendido</em>", clase: "sombra",
    tecnica: "Óleo sobre lienzo", dimensiones: "100 × 70 cm",
    obra: [
      "Una tarde saliendo del Alcoraz. El cerro de San Jorge, con la luz encendiéndolo todo. No incendiado pero igualmente violento. El naranja tiñendo los árboles desde dentro, como si la luz no viniera del cielo, sino del interior del cerro.",
      "El contraste no decora. Obliga. El azul frío y denso del bosque hace que el naranja de las ramas no tenga otra opción que gritar."
    ],
    proceso: [
      "Los troncos grandes anclan la composición verticalmente, sólidos, casi arquitectónicos. Pero conforme bajan hacia el suelo pierden definición, se convierten en líneas, en chorreras, en gestos sin detalle. La pintura se adelgaza donde la realidad se vuelve menos importante.",
      "El azul no es un color natural. Es una decisión emocional, ultramar y prusia mezclados en distintas densidades, algunos pasajes casi negros, otros casi eléctricos. El naranja de las ramas delgadas trabaja por complementariedad directa, la pareja cromática de máxima tensión. Juntos no descansan."
    ],
    referencia_texto: [
      "Mondrian pintó el árbol rojo justo antes de que el árbol dejara de ser árbol. La rama como línea, el color como emoción, la estructura vegetal como camino hacia otra cosa. No le interesaba el árbol, le interesaba lo que el árbol podía llegar a ser.",
      "Aquí el recorrido es inverso. Las ramas que suben son reconocibles, concretas. Las que bajan se disuelven en la pintura. El árbol no avanza hacia la abstracción, la roza y vuelve."
    ],
    referencia_link: { autor: "Piet Mondrian — El árbol rojo", url: "https://commons.wikimedia.org/wiki/File:Piet_Mondrian,_1908-10,_Evening;_Red_Tree_(Avond;_De_rode_boom),_oil_on_canvas,_70_x_99_cm,_Gemeentemuseum_Den_Haag.jpg" }
  },
  "entre-fragmentos": {
    bloque: "Bloque paisaje", titulo: "Entre <em>fragmentos</em>", clase: "sombra",
    tecnica: "Óleo sobre lienzo · Políptico", dimensiones: "348 × 178 cm",
    obra: [
      "Este sauce lleva años en el parque de las olas. Una arquitectura viva que crece hasta dejarse caer.",
      "Y no bastaba una pequeña mirada.",
      "Aquí hay algo que solo ocurre cuando estás a sus pies. No viéndolo desde lejos, no en una foto. A sus pies. Una calidez que no viene del árbol sino de dentro de ti, que sube despacio, que pesa. Y las ramas cayendo hacia ti, cubriéndote."
    ],
    proceso: [
      "El azul en zonas planas para que el protagonismo sea de las ramas. Los verdes saturados caen del árbol. El naranja es lo que sale de ti, lo que el cuerpo genera al estar a sus pies. Dos fuerzas que avanzan la una hacia la otra en ese tronco que estructura y enraíza el caos sin domesticarlo.",
      "Al pintarlo entendí algo que no sabía antes de empezar. Que esa calidez no es solo tuya. Que él también la siente."
    ],
    referencia_texto: [
      "Hockney volvió a Yorkshire después de años en California. Pintó los mismos caminos, los mismos árboles, en distintos momentos y con distintas luces. Los colores que usó no son los que se ven en la naturaleza. Son los que sentía al estar allí.",
      "En eso lo reconocí. El azul que no es descriptivo. El naranja que no es del árbol. El color como única manera honesta de decir lo que ocurre cuando estás dentro de un paisaje que te pertenece.",
      "El políptico responde a la misma lógica. Un solo lienzo habría contenido el árbol. Seis fragmentos lo habitan."
    ],
    referencia_link: { autor: "David Hockney — El bosque de Woldgate", url: "https://www.guggenheim-bilbao.eus/exposicion/el-bosque-de-woldgate-21-23-y-29-de-noviembre-de-2006" }
  },
  "llanura-interior": {
    bloque: "Bloque paisaje", titulo: "Llanura <em>interior</em>", clase: "sombra",

  { type: "obra", id: "en-el-umbral" },
  { type: "obra", id: "mirada-encarnada" },
  { type: "obra", id: "ardiente-calma" },
  { type: "obra", id: "sin-distancia" },
  { type: "obra", id: "pupila-azul" },
  { type: "obra", id: "no-caigas" },
  { type: "obra", id: "antes-de-reconocer" },
  { type: "vinilo", id: "vinilo-cierre-recorrido" },
  { type: "final", id: "pieza-umbral-revelada" }

// "La obra" es el poema propio de Vivo sobre la pieza, respetado casi
// verbatim, en estrofas. "El proceso" es el texto en prosa sobre el
// soporte real y el gesto de repintarlo.
const PORTADA_OBRA = [
  ["No cae de donde nace.", "No es la primera lágrima."],
  ["Ojo flor.", "Llora.", "Síntoma vivo."],
  ["¿Tristeza?", "¿Alegría?", "Lágrimas al fin y al cabo."],
  ["Ese mojar, cubrir y enrojecer.", "Colorear el blanco ojo, rojo, y caer.", "Humedecer y dejar un rastro", "que a su vez atrae."],
  ["Aparecen sombras de mariposas,", "de abejas.", "Síntoma que no distingue", "salado lagrimal", "de dulce néctar.", "Lágrimas al fin y al cabo."],
  ["Síntoma del ojo,", "o de la flor."]
];

const PORTADA_PROCESO = [
  "Debajo de este ojo hay una Virgen con el Niño. Un óvalo devocional, muy antiguo, comprado en Cáritas por unos pocos euros, pintado por alguien cuyo nombre nadie guardó.",
  "La tapé entera. El marco dorado lo dejé como estaba, con su pátina, sus golpes, los años que ya llevaba antes de llegar a mis manos. Solo cambié lo de dentro.",
  "Necesitaba un soporte que ya hubiera sostenido algo antes que yo. Que ya hubiera servido de refugio a alguien. Quería empezar sobre algo que ya supiera sostener peso.",
  "No he puesto esto en ningún otro sitio. No hay cartela junto al caballete, no hay texto en la pared. Si has llegado hasta aquí es porque le has dado la vuelta al marco, o has buscado algo que nadie te dijo que buscaras. Eso ya dice algo de cómo miras.",
  "No sé si lo que está debajo importa más que lo que se ve encima. Puede que la Virgen siga ahí, respirando bajo las capas de óleo, sosteniendo esto sin que nadie lo sepa. Puede que no quede nada de ella. No lo he comprobado. No pienso hacerlo."
];

/* ============ IMÁGENES ============
   Coloca los archivos con estos nombres en una carpeta /img junto a este
   archivo y aparecerán automáticamente. Mientras no existan, se ve el
   hueco vacío con el nombre de archivo esperado. */
const IMG_EXTS = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG'];
function imgSrcAt(id, i) { return `img/${id}.${IMG_EXTS[i]}`; }
// Compatibilidad con el resto del código: primer intento por defecto.
function imgPath(id) { return imgSrcAt(id, 0); }
const PORTADA_IMG = imgSrcAt('portada', 0);

// Si una imagen no carga, prueba la siguiente extensión de la lista
// (jpg, JPG, jpeg, JPEG, png, PNG) antes de rendirse. Así da igual en
// qué formato subas cada foto, mientras el NOMBRE (sin extensión) sea
// el correcto.
function handleImgError(img, phId) {
  const i = (parseInt(img.dataset.extIdx || '0', 10)) + 1;
  if (i < IMG_EXTS.length) {
    img.dataset.extIdx = String(i);
    img.src = imgSrcAt(img.dataset.imgid, i);
  } else if (phId) {
    img.style.display = 'none';
    const ph = document.getElementById(phId);
    if (ph) ph.style.display = 'flex';
  }
}
function handleObraImgLoad(img, id) {
  img.style.display = 'block';
  const placeholder = img.closest('.obra-frame').nextElementSibling;
  if (placeholder) placeholder.style.display = 'none';
  const hires = document.getElementById('hires-' + id);
  if (hires) { hires.href = img.src; hires.style.display = 'inline-block'; }
}

/* ============ ROUTING Y RENDER ============ */

function getRoute() {
  const hash = location.hash.replace('#', '');
  if (!hash || hash === '/') return { type: 'home' };
  if (OBRAS[hash]) return { type: 'obra', id: hash };
  if (VINILOS[hash]) return { type: 'vinilo', id: hash };
  if (hash === 'pieza-umbral-revelada') return { type: 'final', id: hash };
  return { type: 'home' };
}

// Busca el vecino anterior/siguiente en la secuencia real de recorrido,
// sea obra o vinilo, a partir de cualquier id de la secuencia.
function seqNeighbors(id) {
  const idx = SEQUENCE.findIndex(item => item.id === id);
  if (idx === -1) return { prev: null, next: null };
  return {
    prev: idx > 0 ? SEQUENCE[idx - 1] : null,
    next: idx < SEQUENCE.length - 1 ? SEQUENCE[idx + 1] : null
  };
}

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('rys-theme', t);
}
function initTheme() {
  const saved = localStorage.getItem('rys-theme');
  if (saved) { setTheme(saved); return; }
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(prefersDark ? 'dark' : 'light');
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
}

function header(showBackHome) {
  return `
  <header class="top">
    <div>
      <div class="brand" onclick="location.hash=''">
        <span>Reflejos y</span><span>sombras</span>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">Modo</button>
    </div>
    <div class="expo-meta">Palacio de Villahermosa · Huesca · 2026</div>
  </header>`;
}

function footer() {
  return `
  <footer class="bottom">
    <span class="artist-sig">Javier Sanagustín Moreu</span>
    <span class="expo-dates">Huesca · 8 oct – 11 nov 2026</span>
  </footer>`;
}

// Cuando el catálogo esté publicado en Amazon, cambia SOLO esta línea
// por el enlace real (algo como "https://www.amazon.es/dp/XXXXXXXXXX").
// Mientras tanto el botón queda visible pero no lleva a ningún sitio.
const CATALOG_URL = null; // ej: "https://www.amazon.es/dp/XXXXXXXXXX"

function catalogBtn() {
  const url = CATALOG_URL || '#';
  const disabledAttr = CATALOG_URL ? '' : ' onclick="event.preventDefault(); alert(\'El catálogo todavía no está disponible para comprar.\');"';
  return `<a class="catalog-btn" href="${url}"${CATALOG_URL ? ' target="_blank" rel="noopener"' : ''}${disabledAttr}>Adquirir catálogo
    <small>Comprarlo es apoyar directamente este proyecto.</small>
  </a>`;
}

function renderHome() {
  const worklistHtml = ORDEN.map((id, i) => {
    const o = OBRAS[id];
    const dotHtml = o.clase ? `<span class="dot ${o.clase}"></span>` : '';
    return `<li><a href="#${id}">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="name">${o.titulo.replace(/<\/?em>/g,'')}</span>
      ${dotHtml}
    </a></li>`;
  }).join('');

  return `
  ${header()}
  <main>
    <img class="home-portada" src="${PORTADA_IMG}" data-imgid="portada" data-ext-idx="0" alt="Reflejos y sombras, Javier Sanagustín Moreu" onerror="handleImgError(this, 'portada-ph')">
    <div id="portada-ph" class="obra-frame is-placeholder" style="display:none; aspect-ratio:3/4; margin-bottom:40px;">
      <span class="placeholder">img/portada.jpg</span>
    </div>

    <a href="#${SEQUENCE[0].id}" style="display:block; text-align:center; font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-soft); border:1px solid var(--line); padding:12px; margin-bottom:36px;">Comenzar recorrido →</a>

    <div class="vinilo-wrap">
      <p class="vinilo">${VINILO_APERTURA}</p>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="dot reflejo"></span>Reflejo</span>
      <span class="legend-item"><span class="dot sombra"></span>Sombra</span>
    </div>

    <div class="accordion home-accordion">
      <div class="acc-item" data-acc="curatorial">
        <button class="acc-head" onclick="toggleAcc(this)"><span>Sobre la exposición</span><span class="acc-plus">+</span></button>
        <div class="acc-body"><div class="acc-body-inner">${TEXTO_CURATORIAL.map(p=>`<p>${p}</p>`).join('')}</div></div>
      </div>
    </div>

    <ul class="worklist">${worklistHtml}</ul>

    ${catalogBtn()}
  </main>
  ${footer()}
  `;
}

function renderObra(id) {
  const o = OBRAS[id];
  const idx = ORDEN.indexOf(id); // posición entre las 14 obras, solo para el contador X/14
  const { prev, next } = seqNeighbors(id); // vecino real en el recorrido, obra o vinilo

  const refLinkHtml = o.referencia_link
    ? `<a class="acc-ref-link" href="${o.referencia_link.url}" target="_blank" rel="noopener">${o.referencia_link.autor} ↗</a>`
    : '';

  return `
  <header class="top">
    <div>
      <div class="brand" onclick="location.hash=''"><span>Reflejos y</span><span>sombras</span></div>
      <button class="theme-toggle" onclick="toggleTheme()">Modo</button>
    </div>
    <div class="navrow">
      <button class="navbtn" ${prev?`onclick="location.hash='${prev.id}'"`:'disabled'}>‹</button>
      <button class="navbtn" ${next?`onclick="location.hash='${next.id}'"`:'disabled'}>›</button>
    </div>
  </header>
  <main>
    <div class="block-row">
      <span class="label">${o.bloque}</span>
      <span class="label">${String(idx+1).padStart(2,'0')} / ${ORDEN.length}</span>
    </div>

    <div class="obra-frame">
      <img style="display:none;" src="${imgSrcAt(id, 0)}" data-imgid="${id}" data-ext-idx="0" onload="handleObraImgLoad(this, '${id}')" onerror="handleImgError(this)" alt="${o.titulo.replace(/<\/?em>/g,'')}, ${o.tecnica}, Reflejos y sombras, Javier Sanagustín Moreu">
    </div>
    <div class="obra-frame is-placeholder">
      <span class="placeholder">img/${id}.[jpg|png]</span>
    </div>

    <div class="tech-row"><span>${o.tecnica}</span><span>${o.dimensiones}</span></div>

    <h1 class="titulo">${o.titulo}</h1>

    ${o.pendiente ? '<div class="pendiente-flag">Texto en revisión, no cerrado del todo</div>' : ''}

    <div class="cuerpo">${o.obra.map(p=>`<p>${p}</p>`).join('')}</div>

    <div class="accordion">
      <div class="acc-item" data-acc="proceso-${id}">
        <button class="acc-head" onclick="toggleAcc(this)"><span>El proceso</span><span class="acc-plus">+</span></button>
        <div class="acc-body"><div class="acc-body-inner">${o.proceso.map(p=>`<p>${p}</p>`).join('')}</div></div>
      </div>
      <div class="acc-item" data-acc="referencia-${id}">
        <button class="acc-head" onclick="toggleAcc(this)">
          <span>La referencia</span>
          <span class="sub">${o.referencia_link ? o.referencia_link.autor : ''}</span>
          <span class="acc-plus">+</span>
        </button>
        <div class="acc-body"><div class="acc-body-inner">${o.referencia_texto.map(p=>`<p>${p}</p>`).join('')}${refLinkHtml}</div></div>
      </div>
    </div>
    <a id="hires-${id}" href="${imgPath(id)}" download target="_blank" class="hires-link" style="display:none;">Imagen en alta resolución ↓</a>
    ${catalogBtn()}
  </main>
  ${footer()}
  `;
}

function renderVinilo(id) {
  const v = VINILOS[id];
  const { prev, next } = seqNeighbors(id);
  return `
  <header class="top">
    <div>
      <div class="brand" onclick="location.hash=''"><span>Reflejos y</span><span>sombras</span></div>
      <button class="theme-toggle" onclick="toggleTheme()">Modo</button>
    </div>
    <div class="navrow">
      <button class="navbtn" ${prev?`onclick="location.hash='${prev.id}'"`:'disabled'}>‹</button>
      <button class="navbtn" ${next?`onclick="location.hash='${next.id}'"`:'disabled'}>›</button>
    </div>
  </header>
  <main>
    <div class="vinilo-screen">
      <span class="label">${v.label}</span>
      ${v.texto.map(p=>`<p>${p}</p>`).join('')}
    </div>
    ${catalogBtn()}
  </main>
  ${footer()}
  `;
}

function renderFinal(id) {
  const { prev, next } = seqNeighbors(id);
  return `
  <header class="top">
    <div>
      <div class="brand" onclick="location.hash=''"><span>Reflejos y</span><span>sombras</span></div>
      <button class="theme-toggle" onclick="toggleTheme()">Modo</button>
    </div>
    <div class="navrow">
      <button class="navbtn" ${prev?`onclick="location.hash='${prev.id}'"`:'disabled'}>‹</button>
      <button class="navbtn" ${next?`onclick="location.hash='${next.id}'"`:'disabled'}>›</button>
    </div>
  </header>
  <main>
    <div class="portada-revisit" style="border-top:none; padding-top:10px;">
      <img class="home-portada small" src="${PORTADA_IMG}" data-imgid="portada" data-ext-idx="0" alt="Pieza umbral, óvalo devocional repintado" onerror="handleImgError(this)">
      <button class="portada-revisit-toggle" onclick="togglePortada()">¿Qué hay debajo de esta imagen?</button>
      <div class="portada-hidden-text" id="portada-hidden">
        <div class="inner">
          <p class="label" style="margin-bottom:14px;">La obra</p>
          ${PORTADA_OBRA.map(estrofa => `<p style="margin-bottom:20px;">${estrofa.join('<br>')}</p>`).join('')}
          <p class="label" style="margin:30px 0 14px;">El proceso</p>
          ${PORTADA_PROCESO.map(p=>`<p>${p}</p>`).join('')}
        </div>
      </div>
    </div>
    ${catalogBtn()}
  </main>
  ${footer()}
  `;
}

function toggleAcc(btn) {
  btn.parentElement.classList.toggle('open');
}
function togglePortada() {
  document.getElementById('portada-hidden').classList.toggle('open');
}

function render() {
  const route = getRoute();
  const app = document.getElementById('app');
  if (route.type === 'obra') {
    app.innerHTML = renderObra(route.id);
  } else if (route.type === 'vinilo') {
    app.innerHTML = renderVinilo(route.id);
  } else if (route.type === 'final') {
    app.innerHTML = renderFinal(route.id);
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);
initTheme();
render();
</script>
</body>
</html>
